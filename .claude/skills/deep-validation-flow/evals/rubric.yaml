version: "0.1.0"
scale:
  min: 0
  max: 4
dimensions:
  decision_framing:
    weight: 15
    pass: "Decision, options, owner, constraints, and decision-changing evidence are explicit."
  hypothesis_quality:
    weight: 10
    pass: "Competing and falsifiable hypotheses include a status-quo or null view."
  evidence_integrity:
    weight: 20
    pass: "Claims are traceable, fresh where needed, source-fit, and independence-aware."
  diversity_and_handoffs:
    weight: 10
    pass: "Independent perspectives differ materially and structured handoffs are acknowledged."
  adversarial_validation:
    weight: 10
    pass: "Counterevidence, ACH, assumption audit, premortem, and dissent affect the judgment."
  quantification:
    weight: 10
    pass: "Ranges, outside view, full economics, sensitivities, and unknowns are visible."
  gate_quality:
    weight: 10
    pass: "Kill, pivot, scale, and review gates have observable thresholds and actions."
  decision_usability:
    weight: 10
    pass: "The output has one status, confidence, risks, and executable next actions."
  actual_state:
    weight: 5
    pass: "Claimed files, writes, and executions are verified in their real destination."
thresholds:
  ready_for_decision_weighted_score: 80
  maximum_dimension_below_2: 0
hard_fails:
  - "Untraceable decision-critical claim"
  - "Unrefreshed time-sensitive claim"
  - "No opposing evidence"
  - "Correlated work presented as independent"
  - "Launch approval without required gate"
  - "Unverified external write or execution"
  - "Authority-bound action without authorization"
  - "Decision-relevant dissent omitted"
