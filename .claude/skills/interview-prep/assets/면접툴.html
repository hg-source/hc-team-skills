<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀장 채용 면접 툴</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
    --txt:#e7eaf0; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#3b6fd6;
    --good:#3fb950; --warn:#d29922; --bad:#f0506e; --chip:#232834;
    --custom:#7c6cff; --common:#2f9e8f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--txt); font-size:14px; line-height:1.5;
  }
  button{font-family:inherit; cursor:pointer}
  header{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0; font-weight:700; white-space:nowrap}
  .tabs{display:flex; gap:6px; flex:1; flex-wrap:wrap; align-items:center}
  .tab{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px;
    background:var(--chip); border:1px solid var(--line); color:var(--muted); font-size:13px;
  }
  .tab.active{background:var(--accent2); border-color:var(--accent); color:#fff}
  .tab .name{outline:none; min-width:40px}
  .tab .score-badge{font-size:11px; background:rgba(255,255,255,.15); padding:1px 6px; border-radius:6px}
  .tab .x{opacity:.5; font-weight:700}
  .tab .x:hover{opacity:1}
  .btn{
    padding:6px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--chip); color:var(--txt); font-size:13px;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent2); border-color:var(--accent); color:#fff}
  .timer{font-variant-numeric:tabular-nums; font-size:15px; font-weight:600; min-width:64px; text-align:center}
  /* 완료 폴더 */
  .doneFolder{position:relative}
  .done-menu{position:absolute; top:calc(100% + 6px); left:0; z-index:60; min-width:240px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .done-menu.show{display:block}
  .done-empty{color:var(--muted); font-size:12px; padding:8px 10px}
  .done-row{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px}
  .done-row:hover{background:var(--chip)}
  .done-name{font-size:13px; font-weight:600; flex:1}
  .done-meta{font-size:11px; color:var(--muted)}
  .done-reopen{padding:3px 10px; border-radius:6px; border:1px solid var(--line); background:var(--chip); color:var(--txt); font-size:11px; font-weight:600}
  .done-reopen:hover{border-color:var(--accent); color:var(--accent)}
  .main{display:flex; height:calc(100vh - 53px)}
  .left{width:50%; min-width:300px; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--panel2)}
  .right{flex:1; display:flex; flex-direction:column; overflow-y:auto}
  .resizer{width:6px; cursor:col-resize; background:transparent; flex:0 0 auto}
  .resizer:hover{background:var(--accent)}
  .pdf-bar{display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; background:var(--panel)}
  .file-pill{padding:4px 10px; border-radius:14px; background:var(--chip); border:1px solid var(--line); font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center}
  .file-pill.active{background:var(--accent2); color:#fff; border-color:var(--accent)}
  .file-pill .x{opacity:.6; font-weight:700}
  .pdf-view{flex:1; background:#222; display:flex; align-items:center; justify-content:center}
  .pdf-view embed,.pdf-view iframe{width:100%; height:100%; border:0; background:#fff}
  .empty{color:var(--muted); text-align:center; padding:40px; font-size:13px}
  .section{padding:14px 16px; border-bottom:1px solid var(--line)}
  .section h2{font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center}
  .meta-row{display:flex; gap:10px; flex-wrap:wrap}
  .meta-row input{background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; font-size:14px}
  .comp{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px}
  .comp-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px}
  .comp-name{font-weight:600; font-size:14px; background:transparent; border:0; color:var(--txt); outline:none; flex:1}
  .stars{display:flex; gap:4px}
  .star{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--chip); color:var(--muted); font-size:13px; font-weight:600}
  .star.on{background:var(--accent2); border-color:var(--accent); color:#fff}
  .comp textarea, .q textarea, .qrow textarea, .overall textarea{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px; font-size:13px; resize:vertical; min-height:46px; font-family:inherit}
  .catbar{display:flex; align-items:center; gap:8px; margin:14px 0 8px; font-size:12px; font-weight:700; letter-spacing:.03em}
  .catbar .dot{width:9px;height:9px;border-radius:50%}
  .catbar.custom{color:var(--custom)} .catbar.custom .dot{background:var(--custom)}
  .catbar.common{color:var(--common)} .catbar.common .dot{background:var(--common)}
  /* 시안 C: 그룹 카드 */
  .qcard{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:10px 0 12px}
  .qcard.custom{border-left:3px solid var(--custom)} .qcard.common{border-left:3px solid var(--common)}
  .qcard-head{background:#2a2f3a; color:#c9d0dc; font-size:13px; font-weight:700; padding:8px 12px; border-bottom:1px solid var(--line)}
  .qcard-body{background:#13161d; padding:4px 8px}
  .qrow{padding:10px 8px; border-bottom:1px solid #232834}
  .qrow:last-child{border-bottom:0}
  .qrow.done .q-text{color:var(--muted); text-decoration:line-through}
  .q-intent{font-size:12px; font-style:italic; color:#b7a7ff; background:rgba(124,108,255,.08); border-radius:6px; padding:5px 8px; margin:0 0 6px; outline:none; min-height:18px}
  .qcard.common .q-intent{color:#86d6c9; background:rgba(47,158,143,.08)}
  .q-intent:empty:before{content:attr(data-ph); color:var(--muted); opacity:.55; font-style:normal}
  /* AI 1차평가 */
  .aieval{background:#14161d; border-top:2px solid var(--accent)}
  .ai-topbar{display:flex; align-items:center; gap:12px; margin-bottom:10px}
  .ai-verd{font-size:13px; font-weight:700; padding:4px 12px; border-radius:7px; color:#0f1115}
  .ai-verd.good{background:var(--good)} .ai-verd.warn{background:var(--warn)} .ai-verd.bad{background:var(--bad)}
  .ai-score{font-size:26px; font-weight:800} .ai-score small{font-size:13px; color:var(--muted); font-weight:500}
  .ai-sub{font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; margin:12px 0 6px}
  .ai-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .ai-cell{background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 9px; display:flex; flex-direction:column; gap:2px}
  .ai-k{font-size:10.5px; color:var(--muted)} .ai-v{font-size:12.5px}
  .ai-career{width:100%; border-collapse:collapse; table-layout:fixed; margin-top:2px}
  .ai-career th,.ai-career td{border:1px solid var(--line); padding:6px 7px; vertical-align:top; text-align:left; font-size:11.5px; line-height:1.45; word-break:break-word}
  .ai-career th{background:#2a2f3a; color:#c9d0dc; font-weight:700; font-size:11px}
  .ai-career td{background:var(--panel)}
  .ai-career td:first-child{font-weight:600}
  .ai-rows{display:flex; flex-direction:column; gap:5px; margin-top:8px}
  .ai-row{display:flex; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 9px; font-size:12.5px}
  .ai-rk{flex:0 0 44px; font-weight:700; color:var(--muted); font-size:11px; padding-top:1px}
  .ai-row.pass{border-left:3px solid var(--good)} .ai-row.pass .ai-rk{color:var(--good)}
  .ai-row.fail{border-left:3px solid var(--bad)} .ai-row.fail .ai-rk{color:var(--bad)}
  .ai-rv{flex:1}
  .ai-result{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.6; white-space:pre-wrap}
  .q{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px}
  .q.custom{border-left-color:var(--custom)} .q.common{border-left-color:var(--common)}
  .q-head{display:flex; gap:8px; align-items:flex-start; margin-bottom:6px}
  .q-head input[type=checkbox]{margin-top:4px; width:16px; height:16px; accent-color:var(--accent)}
  .q-num{color:var(--muted); font-size:12px; font-weight:700; margin-top:3px; min-width:20px}
  .q-text{flex:1; background:transparent; border:0; color:var(--txt); font-size:13.5px; font-weight:500; outline:none; resize:none; font-family:inherit; line-height:1.4}
  .q.done .q-text{color:var(--muted); text-decoration:line-through}
  .q-del{background:transparent;border:0;color:var(--muted);font-weight:700;opacity:.5}
  .q-del:hover{opacity:1;color:var(--bad)}
  .summary{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .big-score{font-size:34px; font-weight:800}
  .big-score small{font-size:15px; color:var(--muted); font-weight:500}
  .decision{display:flex; gap:6px}
  .dbtn{padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--chip); color:var(--muted); font-size:13px; font-weight:600}
  .dbtn.sel[data-v="strong"]{background:var(--good); color:#fff; border-color:var(--good)}
  .dbtn.sel[data-v="hold"]{background:var(--warn); color:#fff; border-color:var(--warn)}
  .dbtn.sel[data-v="no"]{background:var(--bad); color:#fff; border-color:var(--bad)}
  .add-link{background:transparent; border:1px dashed var(--line); color:var(--muted); width:100%; padding:8px; border-radius:8px; font-size:13px}
  .add-link:hover{border-color:var(--accent); color:var(--accent)}
  .minibtn{padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:11px;font-weight:600}
  .minibtn:hover{border-color:var(--accent);color:var(--accent)}
  input[type=file]{display:none}
  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel2); border:1px solid var(--line); border-radius:12px; width:min(680px,92vw); max-height:88vh; overflow:auto; padding:20px}
  .modal h3{margin:0 0 6px; font-size:16px}
  .modal p{margin:0 0 12px; color:var(--muted); font-size:13px}
  .modal textarea{width:100%; min-height:260px; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:12px; font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace; line-height:1.5}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px}
  .fmt{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; white-space:pre-wrap; margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>🎯 팀장 채용 면접 <span style="font-size:11px;font-weight:500;color:var(--muted)">v1.3</span></h1>
  <div class="doneFolder" id="doneFolder">
    <button class="btn" id="doneBtn">📁 완료 <span id="doneCount">0</span> ▾</button>
    <div class="done-menu" id="doneMenu"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <button class="btn" id="addCand">+ 후보자</button>
  <span class="timer" id="timer">00:00</span>
  <button class="btn" id="timerBtn">▶ 시작</button>
  <button class="btn" id="exportBtn">⬇ 평가표</button>
  <button class="btn" id="jsonExportBtn" title="질문 이력·답변·점수 JSON 백업. PDF 파일은 별도 보관하세요.">⬇ JSON 내보내기</button>
</header>

<div class="main">
  <div class="left" id="left">
    <div class="pdf-bar">
      <button class="btn primary" id="uploadBtn">📎 PDF 추가</button>
      <input type="file" id="fileInput" accept="application/pdf" multiple>
      <div id="filePills" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="pdf-view" id="pdfView">
      <div class="empty">좌측 상단 <b>PDF 추가</b>로 이력서·포트폴리오를 올리세요.</div>
    </div>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="right" id="right"></div>
</div>

<!-- 질문 불러오기 모달 -->
<div class="modal-bg" id="importModal">
  <div class="modal">
    <h3>📋 맞춤 질문 불러오기</h3>
    <p>Claude가 생성한 질문 블록을 그대로 붙여넣고 <b>불러오기</b>를 누르세요. 현재 후보자(<span id="impCandName"></span>)의 질문을 교체합니다.</p>
    <div class="fmt">인식 형식 (자동 파싱):
[맞춤형]            ← 카테고리
# 팀 규모·리더십    ← 그룹(테마)
1. 질문 내용...
   의도: 알아보려는 것
2. 질문 내용...
[공통]
# 브랜드 전략
1. 질문 내용...
   의도: ...

번호(1.)·불릿(- •) 자동 제거. # 줄=그룹, '의도:' 줄=해당 질문 의도.</div>
    <textarea id="importText" placeholder="여기에 붙여넣기하거나, 아래 '📁 파일 선택'으로 질문_이름.txt를 불러오세요..."></textarea>
    <input type="file" id="impFile" accept=".txt,.md,text/plain">
    <div class="modal-actions">
      <button class="btn" id="impFileBtn">📁 파일 선택</button>
      <span style="flex:1"></span>
      <button class="btn" id="impCancel">취소</button>
      <button class="btn primary" id="impLoad">불러오기</button>
    </div>
  </div>
</div>

<script src="./면접_시드.js"></script>
<script>
"use strict";

// ───────── IndexedDB (PDF 영속) ─────────
let db;
function openDB(){return new Promise(res=>{const r=indexedDB.open("interviewTool",1);r.onupgradeneeded=e=>{e.target.result.createObjectStore("pdfs");};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=()=>res();});}
function dbGet(k){return new Promise(res=>{if(!db)return res(null);const t=db.transaction("pdfs").objectStore("pdfs").get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);});}
function dbSet(k,v){return new Promise(res=>{if(!db)return res();const t=db.transaction("pdfs","readwrite").objectStore("pdfs").put(v,k);t.onsuccess=()=>res();t.onerror=()=>res();});}

// ───────── 기본값 ─────────
const LS = "interviewState_v2";
const COMP_VER = 2; // 역량 순서/구성 버전 (바뀌면 기존 state의 역량을 재정렬)
const DEFAULT_COMPS = [
  {id:"c1", name:"문제 해결력 · 의사결정"},
  {id:"c2", name:"실무 전문성 (지원 직무)"},
  {id:"c3", name:"리더십 · 팀 빌딩"},
  {id:"c4", name:"커뮤니케이션 · 협업"},
  {id:"c5", name:"동기 적합성 (Fit)"},
  {id:"c6", name:"성장 잠재력 · 학습민첩성"},
];
// 새 후보자에 들어가는 공통 질문 기본 템플릿
const DEFAULT_QS = [
  {cat:"common", text:"이직을 결심한 이유와, 우리 포지션에 지원한 동기는?"},
  {cat:"common", text:"본인의 리더십 스타일을 한 문장으로 표현한다면?"},
  {cat:"common", text:"성과가 낮은 팀원을 관리해야 했던 경험과 접근 방식은?"},
  {cat:"common", text:"의견이 갈린 상황에서 의사결정을 내린 사례는?"},
  {cat:"common", text:"리소스·일정이 부족할 때 우선순위를 어떻게 정하나요?"},
  {cat:"common", text:"상사·타 부서와 갈등이 있었던 경험과 해결 방법은?"},
  {cat:"common", text:"가장 자랑스러웠던 성과와, 그 안에서 본인의 구체적 역할은?"},
  {cat:"common", text:"입사 후 첫 90일 동안 무엇을 하고 싶나요?"},
  {cat:"common", text:"본인의 가장 큰 약점과 보완하려는 노력은?"},
  {cat:"common", text:"우리 회사·팀·제품에 궁금한 점은?"},
];

// AI evaluation is supplied only by the local candidate seed; no applicant data is bundled.
const AI_EVAL = Object.create(null);
function normalizeAI(value){
  if(!value||typeof value!=="object"||Array.isArray(value)) return null;
  return {...value,info:value.info&&typeof value.info==="object"&&!Array.isArray(value.info)?value.info:{},career:(Array.isArray(value.career)?value.career:[]).filter(row=>row&&typeof row==="object")};
}

let state = load();
function load(){
  try{ const s=JSON.parse(localStorage.getItem(LS));
    if(s&&s.candidates){
      // 역량 버전 변경 전의 정의와 기록을 보관한다. 안정된 ID의 점수는 유지한다.
      if(s.compVer!==COMP_VER){
        const prior={at:new Date().toISOString(),version:s.compVer,competencies:structuredClone(s.competencies||[]),candidates:structuredClone(s.candidates)};
        s.competencies=structuredClone(DEFAULT_COMPS);
        // Stable competency IDs retain scores and notes; preserve prior labels too.
        s.competencyHistory=s.competencyHistory||[];
        s.competencyHistory.push(prior);
        s.compVer=COMP_VER;
      }
      return s;
    }
  }catch(e){}
  return { compVer:COMP_VER, competencies:structuredClone(DEFAULT_COMPS), candidates:[newCand("후보자 1")], active:null };
}
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }
function uid(){ return "id"+Math.random().toString(36).slice(2,9); }
function newCand(name){
  return {id:uid(), name:name||"후보자", position:"", pdfs:[], scores:{}, compMemos:{},
    questions: structuredClone(DEFAULT_QS).map(q=>({id:uid(),cat:q.cat,text:q.text})),
    answers:{}, checked:{}, overall:"", decision:""};
}
// Preserve matching question IDs and all recorded answers. Removed/changed questions
// remain recoverable in JSON export through questionHistory and the answer maps.
function mergeQuestions(c, incoming){
  const previous=c.questions||[];
  const signature=qs=>JSON.stringify(qs.map(q=>[q.cat,q.group||"",q.intent||"",q.text]));
  if(signature(previous)!==signature(incoming) && previous.length){
    c.questionHistory=c.questionHistory||[];
    c.questionHistory.push({at:new Date().toISOString(),questions:structuredClone(previous),answers:structuredClone(c.answers||{}),checked:structuredClone(c.checked||{})});
  }
  const used=new Set();
  c.questions=incoming.map(q=>{
    const old=previous.find(p=>!used.has(p.id)&&p.cat===q.cat&&p.text===q.text);
    if(old) used.add(old.id);
    return {id:old?old.id:uid(),cat:q.cat,group:q.group||"",intent:q.intent||"",text:q.text};
  });
  c.answers=c.answers||{}; c.checked=c.checked||{};
}
// ── 시드 자동 세팅: window.INTERVIEW_SEED(면접_시드.js)에서 후보자 자동 생성/보강 ──
function applySeed(){
  const seed=window.INTERVIEW_SEED; if(!Array.isArray(seed)||!seed.length) return;
  const ver=window.INTERVIEW_SEED_VER||"";
  const already=state.seedVer===ver;
  seed.forEach(sd=>{
    if(sd.ai) AI_EVAL[sd.name.trim()]=sd.ai;   // 시드에 담긴 AI 1차평가를 주입
    let c=state.candidates.find(x=>(x.name||"").trim()===sd.name.trim());
    if(!c){                       // 신규 후보 → 통째로 생성
      c=newCand(sd.name); state.candidates.push(c);
      c.position=sd.position||"";
      c.pdfs=(sd.pdfs||[]).slice();
      c.questions=(sd.questions||[]).map(q=>({id:uid(),cat:q.cat,group:q.group||"",intent:q.intent||"",text:q.text}));
      c.answers={}; c.checked={};
    }else{                        // 기존 후보 → PDF·포지션 보강, 시드 버전 변경 시 질문 최신화
      c.pdfs=(sd.pdfs||[]).slice();
      if(!(c.position||"").trim()) c.position=sd.position||"";
      if(!already){               // 점수·메모·판정·완료상태는 보존, 질문만 갱신
        mergeQuestions(c,sd.questions||[]);
      }
    }
  });
  // 최초 기본 빈 후보("후보자 N", 손대지 않음)가 있으면 제거
  state.candidates=state.candidates.filter(c=>{
    const hasRecords=[c.answers,c.checked,c.scores,c.compMemos].some(m=>Object.values(m||{}).some(v=>v!==null&&v!==undefined&&v!==""&&v!==false)) || c.overall || c.decision || c.done || c.position || (c.questionHistory||[]).length;
    const untouched=/^후보자\s*\d*$/.test((c.name||"").trim()) && (!c.pdfs||!c.pdfs.length) && !(c.questions||[]).some(q=>q.cat==="custom") && !hasRecords;
    return !untouched;
  });
  if(!state.candidates.length) state.candidates.push(newCand("후보자 1"));
  state.seedVer=ver; save();
}

// ───────── 좌측 PDF (Blob + objectURL: 대용량 안전) ─────────
let curFiles=[];   // {name, blob}
let curUrls=[];    // 해제할 objectURL
function dataURLtoBlob(d){
  try{ const i=d.indexOf(","); const head=d.slice(0,i); const b64=d.slice(i+1);
    const mime=(head.match(/:(.*?);/)||[])[1]||"application/pdf";
    const bin=atob(b64); const u=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    return new Blob([u],{type:mime}); }catch(e){ return null; }
}
async function loadPdfs(){
  const s=await dbGet(state.active);
  const blobItems=[];
  (s||[]).forEach(f=>{
    if(f.blob instanceof Blob) blobItems.push({name:f.name,blob:f.blob});
    else if(f.dataUrl){ const b=dataURLtoBlob(f.dataUrl); if(b) blobItems.push({name:f.name,blob:b}); }
  });
  const c=active();
  // 시드(폴더 내) PDF — 상대경로로 표시 (base64 임베드 없이 대용량 OK)
  const seedItems=(c&&Array.isArray(c.pdfs)?c.pdfs:[]).map(nm=>({name:nm, path:"./"+encodeURIComponent(nm)}));
  curFiles=[...seedItems, ...blobItems.filter(b=>!seedItems.some(s=>s.name===b.name))]; // 중복 제거
  // 파일명으로 후보자명·포지션 자동 보정
  if(c && curFiles[0]){
    const meta=parseCandidateFromFilename(curFiles[0].name);
    let changed=false;
    if(meta.name && (/^후보자\s*\d*$/.test((c.name||"").trim())||!(c.name||"").trim())){ c.name=meta.name; changed=true; }
    if(meta.position && !(c.position||"").trim()){ c.position=meta.position; changed=true; }
    if(changed){ save(); renderTabs(); renderRight(); }
  }
  renderPdfBar(0);
}
function clearUrls(){ curUrls.forEach(u=>URL.revokeObjectURL(u)); curUrls=[]; }
function renderPdfBar(idx){
  const pills=document.getElementById("filePills"); pills.innerHTML="";
  curFiles.forEach((f,i)=>{
    const p=document.createElement("div"); p.className="file-pill"+(i===idx?" active":"");
    p.innerHTML=`<span>📄 ${esc(f.name)}</span><span class="x">×</span>`;
    p.querySelector("span").addEventListener("click",()=>renderPdfBar(i));
    p.querySelector(".x").addEventListener("click",async e=>{
      e.stopPropagation();
      const removed=curFiles.splice(i,1)[0];
      const c=active();
      if(removed && removed.path && c && Array.isArray(c.pdfs)){ c.pdfs=c.pdfs.filter(nm=>nm!==removed.name); save(); }
      await persistPdfs();  // Blob 항목만 저장
      renderPdfBar(0);
    });
    pills.appendChild(p);
  });
  const v=document.getElementById("pdfView");
  clearUrls();
  const it=curFiles[idx];
  if(it){
    let src;
    if(it.path){ src=it.path; }
    else { src=URL.createObjectURL(it.blob); curUrls.push(src); }
    v.innerHTML=`<iframe src="${src}#view=FitH" title="${esc(it.name)}"></iframe>`;
  }else{
    v.innerHTML=`<div class="empty">좌측 상단 <b>PDF 추가</b>로 이력서·포트폴리오를 올리세요.</div>`;
  }
}
async function persistPdfs(){ await dbSet(state.active, curFiles.filter(f=>f.blob).map(f=>({name:f.name,blob:f.blob}))); }

document.getElementById("fileInput").addEventListener("change",async e=>{
  const files=[...e.target.files];
  for(const file of files){ curFiles.push({name:file.name,blob:file}); }
  await persistPdfs();
  // 파일명에서 후보자명·지원 포지션 자동 추출
  const c=active();
  const meta=parseCandidateFromFilename(files[0]?files[0].name:"");
  let changed=false;
  const isDefaultName=/^후보자\s*\d*$/.test((c.name||"").trim())||!(c.name||"").trim();
  if(meta.name && isDefaultName){ c.name=meta.name; changed=true; }
  if(meta.position && !(c.position||"").trim()){ c.position=meta.position; changed=true; }
  if(changed){ save(); renderAll(); }

// 파일명 예: "상품기획 팀장_홍길동_지원서류(1).pdf" (형식 설명용 가상 이름)
function parseCandidateFromFilename(fn){
  if(!fn) return {name:"",position:""};
  let s=fn.replace(/\.[^.]+$/,"");           // 확장자 제거
  s=s.replace(/^\s*\[[^\]]*\]\s*/,"");        // 앞 [부서] 제거
  const parts=s.split(/[_]/).map(x=>x.trim()).filter(Boolean);
  const docWords=/(이력서|지원서류|포트폴리오|자기소개서|경력기술서|이력|포폴|resume|cv|cover)/i;
  const posWords=/(팀장|매니저|리드|파트장|본부장|담당|마케터|디자이너|기획자|pm|담당자)/i;
  let name="", position="";
  for(const p of parts){
    const bare=p.replace(/\([^)]*\)/g,"").trim();        // (LABNOSH),(1) 등 제거
    if(!name && /^[가-힣]{2,4}$/.test(bare) && !docWords.test(bare) && !posWords.test(bare)){ name=bare; continue; }
    if(!position && posWords.test(p) && !docWords.test(p)){ position=bare; }
  }
  return {name, position};
}

document.getElementById("impFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ document.getElementById("importText").value=fr.result;
    loadQuestionsFromText(fr.result); };  // 읽는 즉시 바로 반영
  fr.readAsText(f,"utf-8");
  e.target.value="";
});
function parseQuestions(txt){
  const out=[]; let cat="custom"; let group="";
  txt.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    // 섹션 헤더: [맞춤형] / 맞춤형 / 공통
    const bare=line.replace(/[\[\]#>*\s]/g,"");
    if(/^맞춤형?(질문)?$/.test(bare)){ cat="custom"; group=""; return; }
    if(/^(공통|직무공통)(질문)?$/.test(bare)){ cat="common"; group=""; return; }
    // 의도 라인
    if(/^[\(\s]*의도\s*[:：]/.test(line)){ if(out.length) out[out.length-1].intent=line.replace(/^[\(\s]*의도\s*[:：]\s*/,"").replace(/\)\s*$/,"").trim(); return; }
    // 그룹(테마) 헤더: # / ## / ■ / ▶
    if(/^(#{1,6}|[■▶●▪])\s*/.test(line)){ group=line.replace(/^(#{1,6}|[■▶●▪])\s*/,"").trim(); return; }
    // 질문: 번호/불릿/'질문:' 프리픽스 제거
    let q=line.replace(/^\s*(\d+[\.\)]|[-•*])\s*/,"").replace(/^질문\s*[:：]\s*/,"").trim();
    if(q) out.push({cat,group,intent:"",text:q});
  });
  return out;
}

// ───────── 내보내기 ─────────
function exportSnapshot(){
  return {format:"interview-prep-backup",version:1,exportedAt:new Date().toISOString(),state:structuredClone(state),ai:structuredClone(AI_EVAL),note:"PDF binaries are not included; keep the original PDF files separately."};
}
document.getElementById("jsonExportBtn").addEventListener("click",()=>{
  const a=document.createElement("a");
  const url=URL.createObjectURL(new Blob([JSON.stringify(exportSnapshot(),null,2)],{type:"application/json;charset=utf-8"}));
  a.href=url; a.download=`면접기록_${new Date().toISOString().replace(/[:.]/g,"-")}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.getElementById("exportBtn").addEventListener("click",()=>{
  let out=`# 팀장 채용 면접 평가표\n생성: ${new Date().toLocaleString("ko-KR")}\n`;
  state.candidates.forEach(c=>{
    out+=`\n${"=".repeat(52)}\n## ${c.name}  (${c.position||"-"})\n`;
    const d={strong:"강력 추천",hold:"보류",no:"부적합"}[c.decision]||"-";
    out+=`종합점수: ${avgScore(c)?avgScore(c).toFixed(2):"-"} / 5.0   |   판정: ${d}\n\n### 역량 평가\n`;
    state.competencies.forEach(k=>{ out+=`- ${k.name}: ${c.scores[k.id]||"-"}/5  ${c.compMemos[k.id]?"→ "+c.compMemos[k.id]:""}\n`; });
    ["custom","common"].forEach(cat=>{
      const items=c.questions.filter(q=>(cat==="custom"?q.cat==="custom":q.cat!=="custom"));
      if(!items.length)return;
      out+=`\n### ${cat==="custom"?"맞춤형":"공통"} 질문\n`;
      let lastG=null,i=0;
      items.forEach(q=>{ i++;
        if((q.group||"")!==lastG){ lastG=q.group||""; if(lastG) out+=`\n[${lastG}]\n`; }
        out+=`Q${i}. ${q.text}\n`;
        if(q.intent) out+=`   (의도: ${q.intent})\n`;
        out+=`A. ${c.answers[q.id]||"-"}\n\n`;
      });
    });
    out+=`### 총평\n${c.overall||"-"}\n`;
  });
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([out],{type:"text/plain;charset=utf-8"}));
  a.download=`면접평가표_${new Date().toISOString().slice(0,10)}.txt`; a.click();
});

document.getElementById("addCand").addEventListener("click",()=>{
  const c=newCand("후보자 "+(state.candidates.length+1)); state.candidates.push(c); state.active=c.id; save(); renderAll();
});

});

// 타이머
let tSec=0,tInt=null;
document.getElementById("timerBtn").addEventListener("click",function(){
  if(tInt){clearInterval(tInt);tInt=null;this.textContent="▶ 계속";}
  else{tInt=setInterval(()=>{tSec++;document.getElementById("timer").textContent=fmt(tSec);},1000);this.textContent="⏸ 일시정지";}
});
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}

// 리사이저
(function(){const rz=document.getElementById("resizer"),left=document.getElementById("left");let drag=false;
  rz.addEventListener("mousedown",()=>{drag=true;document.body.style.userSelect="none";});
  window.addEventListener("mouseup",()=>{drag=false;document.body.style.userSelect="";});
  window.addEventListener("mousemove",e=>{if(!drag)return;left.style.width=Math.max(300,Math.min(e.clientX,window.innerWidth-340))+"px";});})();
