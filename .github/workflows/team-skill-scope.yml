name: Team skill scope

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-team-skill-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/verify-team-skill-scope.mjs
